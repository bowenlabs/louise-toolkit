id: no-astro-events-in-client
language: TypeScript
severity: error
message: "The client must not listen for a specific framework's navigation events."
note: |
  `packages/louise/src/client` used to call
  `document.addEventListener("astro:before-swap", …)` directly. Those names are
  the HOST's now: it calls `louiseNavigation.beforeSwap()` / `.afterSwap()` and
  Louise never learns what produced the signal (#327 Phase 1).

  Subscribe with `onLouiseNavigate("before-swap" | "after-swap", handler)` from
  `./lifecycle`, which returns an unsubscribe.

  This is narrower than the eventual "no `astro` anywhere in src" guard, because
  `src/astro/` still exists until it moves to `@louise-toolkit/astro`.
files:
  - "packages/louise/src/client/**/*.ts"
  - "packages/louise/src/client/**/*.tsx"
rule:
  all:
    - kind: string
      regex: "astro:(before-swap|after-swap|page-load)"
    # The seam's own header documents the events a host wires; that is the one
    # place naming them is correct.
    - not:
        inside:
          kind: program
          has:
            kind: comment
            regex: "framework-neutral replacement"
          stopBy: end
