# Prose linting for the published documentation, against the Google developer
# documentation style guide.
#
# `StylesPackages` makes the Google style a resolved dependency rather than
# vendored source: `vale sync` fetches it into StylesPath, which is gitignored.
# Same reasoning as `lint:solid` fetching oxlint through dlx — the rules are
# pinned and reproducible without living in this tree.
StylesPath = .vale
MinAlertLevel = error
Packages = Google

# The published Starlight docs — the surface a reader actually meets, covering
# the toolkit and its adapter. Source comments are out of scope: they are
# written for maintainers, and the Google guide is a guide for user-facing prose.
[workers/docs/src/content/docs/**/*.md]
BasedOnStyles = Google

# Google.EmDash is ON, and the 510 spaced em dashes in prose were converted to
# meet it. That was a deliberate call to adopt the guide rather than carve out the
# house voice — see the changeset for the tradeoff.
#
# Scope note: only prose changed. The 30 spaced dashes inside fenced code samples
# were left alone, because a reader copies those verbatim and they mirror how the
# source comments are actually written.

# Google.Units stays ON. My first read of it — "all 8 hits are false positives" —
# was wrong, and checking the actual lines is what showed it: five were real
# durations (`60s TTL`, `30s stale`, `10s`, `~24h`) and were fixed. Only three were
# false: `401s` and `404s`, HTTP status codes used as plural nouns, which Vale
# reads as seconds. Those were fixed in the prose rather than suppressed —
# "401 responses are never retried" is clearer for a human reader too, so the
# false positive pointed at genuinely ambiguous writing.
TokenIgnores = (?s)^---\n.*?\n---

# Google.LyHyphens is OFF for a funnier reason: it flags words ending in "ly" as
# adverbs needing no hyphen, and "**supply**-chain" trips it. One hit, one false
# positive.
Google.LyHyphens = NO

# Google.Quotes is OFF as a judgement call, not an oversight. It wants
# `says "editor."` with the period inside, which is correct American typography
# and wrong here: the quoted string is a LITERAL VALUE, and putting the period
# inside implies the period is part of it. Accuracy for a reader copying that
# value beats the typographic convention.
Google.Quotes = NO

# Starlight frontmatter is YAML, not prose.
# Fenced code blocks are samples a reader copies verbatim, not prose. Vale skips
# most of them on its own but not reliably — it flagged 2 of 30 in-code dashes,
# which would have produced inconsistency INSIDE the samples had we "fixed" them.
# Excluding them explicitly is the principled version of what Vale was doing by
# accident.
BlockIgnores = (?s) *(```.*?```)
