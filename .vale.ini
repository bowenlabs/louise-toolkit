# Vale for this repository. The rules and the reasons for them live in the
# house package, vale/package/.vale.ini (ADR 0013), which every Bowen Labs
# repository shares. This file only says where styles go and which packages to
# fetch.
#
# `vale sync` fetches the Google style and copies the house package into the
# gitignored .vale/. Other repositories name the house package by its release
# URL instead of this path; the files are the same.
StylesPath = .vale
Packages = Google, vale/package
