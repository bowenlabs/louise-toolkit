# Prose linting against the Google developer documentation style guide, for
# every doc and all the prose in code. ADR 0013 records the decision; the
# ratchet in scripts/ci/checks/vale-ratchet.mjs enforces it area by area.
#
# `Packages` makes the Google style a resolved dependency rather than vendored
# source: `vale sync` fetches it into vale/styles/Google, which is gitignored.
# Same reasoning as `lint:solid` fetching oxlint through dlx: the rules are
# pinned and reproducible without living in this tree. The house style,
# vale/styles/Louise, and its vocabulary are committed, because this repo owns
# them.
StylesPath = vale/styles
MinAlertLevel = error
Packages = Google
Vocab = Louise

# Markdown and MDX: the Starlight docs, the ADRs, CLAUDE.md, READMEs,
# changesets and CHANGELOGs.
[*.{md,mdx}]
BasedOnStyles = Google, Louise

# Frontmatter is YAML, not prose.
TokenIgnores = (?s)^---\n.*?\n---

# Fenced code blocks are samples a reader copies verbatim, not prose. Vale skips
# most of them on its own but not reliably; it once flagged 2 of 30 in-code
# dashes, which would have produced inconsistency INSIDE the samples had we
# "fixed" them. Excluding them explicitly is the principled version of what
# Vale was doing by accident.
BlockIgnores = (?s) *(```.*?```)

# Google.LyHyphens is OFF: it flags words ending in "ly" as adverbs needing no
# hyphen, and "**supply**-chain" trips it. One hit, one false positive.
Google.LyHyphens = NO

# Google.Quotes is OFF as a judgement call, not an oversight. It wants
# `says "editor."` with the period inside, which is correct American typography
# and wrong here: the quoted string is a LITERAL VALUE, and putting the period
# inside implies the period is part of it. Accuracy for a reader copying that
# value beats the typographic convention.
Google.Quotes = NO

# Google.EmDash stays ON everywhere, comments included: `word—word`, never
# `word — word`. Google.Units stays ON too. Its only false positives were HTTP
# status codes used as plural nouns (`401s` read as seconds), and rewording
# those ("401 responses are never retried") read better for a human as well.

# Code: Vale lints comments and JSDoc only, never string literals or code. JSDoc
# ships in the published .d.ts files and shows up in a consumer's editor, so it
# is user-facing prose too.
[*.{ts,tsx,js,mjs}]
BasedOnStyles = Google, Louise
Google.LyHyphens = NO
Google.Quotes = NO
