name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  # ---------------------------------------------------------------------------
  # Three independent roots. None of them needs a build, so they all start at
  # once and the slowest one — not their sum — sets the time to first red.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint & dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `vp check` is per-package: it reads its config from that package's
      # vite.config.ts, so it must be run from inside each one. Only `louise` has
      # a config (type-aware lint + typeCheck).
      - name: Lint & format — louise (Oxlint + Oxfmt)
        run: corepack pnpm -C packages/louise run check

      - name: Lint & format — the Astro adapter (Oxlint + Oxfmt)
        run: corepack pnpm -C packages/louise-astro run check

      # Everything the two package checks don't reach: docs/, workers/,
      # scripts/, and the repo root.
      #
      # Formatting only, and via `vp fmt` rather than `vp check`: `vp check` from
      # the repo root finds no config and would silently apply vp's defaults as if
      # they were this repo's style.
      - name: Format — everything else (Oxfmt)
        run: corepack pnpm run fmt:check

      # oxlint doesn't parse .astro; Biome lints the component scripts (partial
      # Astro support). Scoped to **/*.astro in biome.json — no overlap with
      # oxlint.
      - name: Lint .astro (Biome)
        run: corepack pnpm run lint:astro

      # `vp check` uses vp's own bundled oxlint and ignores the repo
      # .oxlintrc.json (and its jsPlugins). Run a standalone oxlint to load
      # eslint-plugin-solid via jsPlugins and lint the SolidJS inline-edit client
      # (solid/* rules). It MUST be isolated (`pnpm dlx`, which fetches into a
      # temp store), not a node_modules dep — a node_modules oxlint shadows vp's
      # and breaks `vp check` (vp reads its oxlint config from vite.config.ts,
      # which imports vite-plus, unresolvable to a standalone oxlint).
      #
      # The `lint:solid` script pins both packages, so this fetches the same two
      # versions every run rather than whatever is newest.
      - name: Lint SolidJS client (oxlint + eslint-plugin-solid)
        run: corepack pnpm run lint:solid

      # Architectural invariants oxlint cannot express, because they are about
      # the SHAPE of a statement rather than a name: a value import of
      # `cloudflare:workers` in the library is a violation while a type-only
      # import of the same module is correct and load-bearing. Rules live in
      # .ast-grep/rules; each carries a `note` explaining the invariant, since a
      # rule nobody understands gets deleted the first time it is inconvenient.
      - name: Architectural rules (ast-grep)
        run: corepack pnpm run lint:arch

      # The framework-agnostic claim, enforced (#327). A text scan rather than an
      # AST rule, because what leaks back in is prose: "e.g. `astro dev`" in a
      # comment is a constant temptation, since Astro genuinely IS the clearest
      # example to reach for. Astro belongs in @louise-toolkit/astro or astroidjs.
      - name: No framework references in the core (louise-toolkit)
        run: node scripts/ci/checks/no-astro-in-core.mjs

      # Prose style for the published docs, against the Google developer
      # documentation style guide. `vale sync` fetches the style package into a
      # gitignored .vale/ — pinned, reproducible, not vendored, the same shape as
      # the `lint:solid` dlx fetch above.
      - name: Documentation style (Vale + Google)
        run: |
          corepack pnpm --package=@vvago/vale@3.17.1 dlx vale sync
          corepack pnpm run lint:docs

      # Dead-code check: unused files and exports across the workspace. Runs on
      # source (entry points mapped in knip.jsonc), so no build is needed.
      - name: Dead-code check (Knip)
        run: corepack pnpm run knip

      # Release tooling, exercised on every PR rather than discovered at release
      # time. `changeset status` is the cheapest command that actually loads the
      # changesets stack, and nothing else in this suite touches it: a workspace
      # refresh once resolved `read-yaml-file`'s js-yaml to a 4.x that removed
      # the `safeLoad` it calls, and every changesets command died while all
      # eighteen other legs stayed green. A dead release tool should fail a PR,
      # not a release.
      - name: Release tooling (changesets)
        run: corepack pnpm run lint:release

  test:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Type-check the library
        run: corepack pnpm -C packages/louise run typecheck

      - name: Test
        run: corepack pnpm -C packages/louise run test

      # The adapter aliases `louise-toolkit/*` to source (vitest.config.ts), so it
      # needs no build.
      - name: Test (Astro adapter)
        run: corepack pnpm -C packages/louise-astro run test

  # ---------------------------------------------------------------------------
  # The build fan-out point. Everything below consumes its artifacts rather than
  # rebuilding, so the library is packed exactly once per run.
  # ---------------------------------------------------------------------------

  pack:
    name: Build & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `pnpm run build` here, not `vp run louise#pack`: the task-runner form can
      # serve a cache hit without restoring dist/, leaving the site build unable
      # to resolve the `louise-toolkit/*` subpaths.
      - name: Build the library (dist/)
        run: corepack pnpm -C packages/louise run build

      # Verify the PUBLISHED export map: every subpath in `exports` emitted, and
      # every symbol a first-party consumer needs reachable without touching
      # `louise-toolkit/src/...`. The whole test suite is blind to this, because
      # vitest aliases the package to source. With astroid gone to its own repo
      # (#327), the adapter type-check below is the only remaining consumer that
      # resolves through the real export map, which is why this explicit check
      # matters more now, not less.
      - name: Verify the export map
        run: node scripts/ci/checks/export-map.mjs

      # Type-check the adapter against the BUILT library, which is why it runs
      # after the build above and not next to the louise type-check in `test`.
      #
      # The adapter's vitest aliases `louise-toolkit/*` to source, so its suite
      # resolves imports the published package may not actually expose — it cannot
      # see an export-map problem. This resolves through node_modules like a real
      # consumer, so a subpath that isn't exported (or isn't emitted by the build)
      # fails here instead of in someone's install.
      #
      # The gap this closes: `louise-toolkit/content/sections` was added as a new
      # export, and nothing in CI would have caught it being missing from the
      # export map or the build output.
      - name: Type-check the Astro adapter (against the built library)
        run: corepack pnpm -C packages/louise-astro run typecheck

      - name: Build the Astro adapter (dist/)
        run: corepack pnpm -C packages/louise-astro run build

      - uses: actions/upload-artifact@v7
        with:
          name: louise-dist
          path: packages/louise/dist
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: louise-astro-dist
          path: packages/louise-astro/dist
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Three consumers of the packed output, in parallel. The two scaffold jobs were
  # sequential steps sharing one clean room; they now share a warm pnpm store via
  # the setup action's cache instead, which is what made splitting them cheap.
  # ---------------------------------------------------------------------------

  site:
    name: Build the site
    runs-on: ubuntu-latest
    needs: pack
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The site resolves `louise-toolkit/*` AND `@louise-toolkit/astro` through
      # workspace links, both of which point at a `dist/`. Restore both packed
      # builds rather than rebuilding them — missing the adapter's is what made
      # this job fail with "Failed to resolve entry for package".
      - uses: actions/download-artifact@v8
        with:
          name: louise-dist
          path: packages/louise/dist

      - uses: actions/download-artifact@v8
        with:
          name: louise-astro-dist
          path: packages/louise-astro/dist

      - name: Build the site
        run: corepack pnpm run build:site

  # A single required check to protect the branch with, so adding a job later
  # doesn't mean editing branch protection.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, pack, site]
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
