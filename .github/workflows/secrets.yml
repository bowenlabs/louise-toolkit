name: Secrets

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history: a secret that was committed and later deleted is still
      # in the repository, so the scan reads every commit, not just the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks-action, which needs a license
      # key from gitleaks.io on any repository that an organization owns. The
      # tarball is pinned by version and checksum; bump both together.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz

      # A finding fails the run. Rotate a real secret first, and then remove
      # it from the code. For a false positive, add the fingerprint that this
      # step prints to `.gitleaksignore`, with a comment that says why.
      - name: Scan the git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
