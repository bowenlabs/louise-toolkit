# The Louise house configuration for Vale: the Google developer documentation
# style guide, the Louise style on top of it, and the choices that go with them
# (ADR 0013). This is a "complete" Vale package: `vale sync` reads this file
# before the consuming repository's own .vale.ini, so a repository only has to
# name the package and set its StylesPath.
#
# louise-toolkit consumes it from this directory; every other repository
# consumes the same files from the pinned release asset `Louise.zip`. Change a
# rule here, and every repository picks it up on the next package release.
MinAlertLevel = error
Vocab = Louise

# Markdown and MDX: docs, ADRs, CLAUDE.md, READMEs, changesets and CHANGELOGs.
[*.{md,mdx}]
BasedOnStyles = Google, Louise


# Frontmatter is YAML, not prose.
TokenIgnores = (?s)^---\n.*?\n---

# Fenced code blocks are samples a reader copies verbatim, not prose, and Vale's
# Markdown parser already skips them. There is deliberately NO BlockIgnores for
# fences. An earlier `(?s) *(```.*?```)` meant to belt-and-brace that silently
# stopped Vale partway through any file with certain fences: 379 findings in 8
# files went unreported, 339 of them in the CHANGELOG. Removing it surfaced
# none inside a fence.

# Google.LyHyphens is OFF: it flags words ending in "ly" as adverbs needing no
# hyphen, and "**supply**-chain" trips it. One hit, one false positive.
Google.LyHyphens = NO

# Google.Quotes is OFF as a judgement call, not an oversight. It wants
# `says "editor."` with the period inside, which is correct American typography
# and wrong here: the quoted string is a LITERAL VALUE, and putting the period
# inside implies the period is part of it. Accuracy for a reader copying that
# value beats the typographic convention.
Google.Quotes = NO

# Google.EmDash stays ON everywhere, comments included: `word—word`, never
# `word — word`. Google.Units stays ON too. Its only false positives were HTTP
# status codes used as plural nouns (`401s` read as seconds), and rewording
# those ("401 responses are never retried") read better for a human as well.

# Code: Vale lints comments and JSDoc only, never string literals or code. JSDoc
# ships in the published .d.ts files and shows up in a consumer's editor, so it
# is user-facing prose too.
[*.{ts,tsx,js,mjs}]
BasedOnStyles = Google, Louise
Google.LyHyphens = NO
Google.Quotes = NO

# Google.Spacing is OFF for code, and only for code. It flags a period with no
# space after it, which in a comment is almost always a dotted identifier:
# `env.AI`, `App.Locals`, `Number.MAX_SAFE_INTEGER`. Backticks don't help,
# because Vale reads a code comment as plain text, not Markdown, so a code
# span there is just more text. 657 findings, and every one checked was an
# identifier. In Markdown the rule stays on, where backticks do work.
Google.Spacing = NO